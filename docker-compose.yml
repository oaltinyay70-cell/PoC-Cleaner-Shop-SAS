services:
  # --- PostgreSQL Database ---
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: service_platform
      POSTGRES_USER: sp_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_in_production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sp_user -d service_platform" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Backend API ---
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://sp_user:${DB_PASSWORD:-changeme_in_production}@db:5432/service_platform
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-encryption-key}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
    ports:
      - "3000:3000"

  # --- Database Migration (run once) ---
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sp_user:${DB_PASSWORD:-changeme_in_production}@db:5432/service_platform
    command: npx prisma migrate deploy --schema=prisma/schema.prisma
    profiles:
      - setup

volumes:
  pgdata:
